name: Draft checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            verification/native-isolate/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Record runtime versions
        run: |
          node --version
          python3 --version
          rustc --version
          pg_config --version
      - run: npm ci
      - run: npm ci --prefix verification/native-isolate --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Check the native-isolate model
        run: |
          npm run check --prefix verification/native-isolate
          npm test --prefix verification/native-isolate
          npm run simulate --prefix verification/native-isolate
      - run: python3 -m venv .local/primitive-python && .local/primitive-python/bin/pip install -r research/haip2-2026-08-30/runners/requirements.txt
      - run: npm run test:cross-language
      - run: npm audit --omit=dev && npm run pack:check
      - name: Build the development container
        run: docker build --pull --target development -t haip:development .
      - name: Check the packaged development service
        run: node --import tsx scripts/smoke-container.ts haip:development
      - name: Verify checks preserve committed files
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: draft-fixture-evidence
          retention-days: 7
          include-hidden-files: true
          path: |
            .local/validation/current/playwright
            .local/validation/current/cross-language-results.json
            .local/validation/current/container-smoke.json
            .local/validation/current/container-server.log
            .local/validation/current/container-postgres.log
